[package]
name = "apex5-arcade"
version = "0.1.0"
edition = "2021"
description = "Trigger Ranger: Apex5 Unleashed 内置像素演示游戏（自适应扳机 + 震动）"
license = "MIT"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 3
